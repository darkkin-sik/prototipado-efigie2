<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de sesión - Efigie</title>
    <style>
        :root { color-scheme: light; --paper: #f3f6f3; --ink: #101a15; --muted: #53615b; --line: #cbd6d0; --green: #6EB392; --green-dark: #4a896b; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; padding: 22px 24px max(24px, env(safe-area-inset-bottom)); background: var(--paper); color: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
        .contenedor { width: min(100%, 760px); min-height: calc(100vh - 46px); margin: 0 auto; display: flex; flex-direction: column; }
        header { display: flex; flex-direction: column; align-items: center; padding-bottom: 34px; }
        .logo { width: min(177px, 54vw); height: auto; margin: 4px 0 30px; }
        h1 { margin: 0; text-align: center; font-size: clamp(1.35rem, 4vw, 1.8rem); }
        .estado { margin: 10px 0 0; color: var(--muted); font-size: 1rem; }
        .lista { flex: 1; margin: 0; padding: 0; list-style: none; }
        .controlador-usuarios { margin-top: 24px; }
        .controlador-usuarios h2 { margin: 0 0 8px; font-size: 1.05rem; }
        .participante { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
        .identidad { display: flex; align-items: center; gap: 10px; min-width: 0; overflow-wrap: anywhere; }
        .marca-bot { padding: 3px 7px; background: #dcebe2; color: #355a46; font-size: 0.75rem; }
        .expulsar { flex: 0 0 auto; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; background: transparent; color: var(--ink); font: inherit; cursor: pointer; }
        .expulsar:hover { background: #e6ece8; }
        .equipos { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
        .equipo { min-width: 0; padding: 12px; border-top: 4px solid var(--color-equipo); background: #ffffff; }
        .equipo h2 { margin: 0 0 6px; text-align: center; font-size: 1rem; }
        .equipo p { margin: 0 0 8px; color: var(--muted); font-size: 0.85rem; }
        .integrantes { margin: 0; padding: 0; list-style: none; }
        .integrante { display: flex; justify-content: space-between; gap: 10px; padding: 8px; border-top: 1px solid var(--line); font-size: 0.9rem; }
        .integrante[data-listo="false"] { background: #fff0ef; color: #a3211b; }
        .integrante[data-listo="true"] { background: #e8f5ec; color: #21643b; }
        .estado-listo { flex: 0 0 auto; font-weight: 700; }
        .acciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding-top: 30px; }
        .contadores-acciones { min-height: 1.4em; margin: 6px 0 0; text-align: center; color: var(--muted); font-size: 0.88rem; }
        .temporizador-guia { min-height: 1.5em; margin: 8px 0 0; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
        .accion { min-height: 48px; padding: 11px 17px; border: 0; border-radius: 4px; background: var(--green); color: #101a15; font: inherit; font-weight: 600; cursor: pointer; }
        a.accion { display: grid; place-items: center; text-align: center; text-decoration: none; }
        .accion-volver { background: #dcebe2; }
        .accion:hover:not(:disabled) { background: var(--green-dark); color: #fff; }
        .pruebas { margin-top: 24px; padding: 16px; border: 1px solid var(--line); background: #fff; }
        .pruebas h2 { margin: 0 0 10px; font-size: 1.05rem; }
        .pruebas label { display: block; margin-bottom: 6px; font-size: 0.9rem; }
        .pruebas select { width: 100%; min-height: 44px; padding: 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); font: inherit; }
        .accesos-prueba { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 9px; margin-top: 12px; }
        .accesos-prueba .accion { min-height: 42px; padding: 8px; font-size: 0.9rem; }
        .accion:disabled, .expulsar:disabled { opacity: 0.55; cursor: not-allowed; }
        .accion:focus-visible, .expulsar:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
        .mensaje { min-height: 1.5em; margin: 12px 0 0; text-align: center; color: var(--muted); }
        @media (max-width: 480px) { body { padding-inline: 18px; } .acciones { gap: 10px; } .accion { padding-inline: 12px; font-size: 0.9rem; } }
    </style>
</head>
<body>
    <main class="contenedor">
        <header>
            <img class="logo" src="/efigie-logo.svg" alt="Efigie">
            <h1>Administración de sesión</h1>
            <p class="estado" id="estadoSesion" aria-live="polite">Esperando participantes... 0/15</p>
        </header>
        <div class="equipos" id="equipos" aria-label="Equipos de la pre-ronda" hidden></div>
        <footer class="acciones">
            <button type="button" class="accion" id="simular">Simular ronda</button>
            <button type="button" class="accion" id="comenzar" disabled>Comenzar ronda</button>
            <button type="button" class="accion" id="forzarListo" hidden>Forzar listo</button>
            <button type="button" class="accion" id="agregarTiempo" hidden>Agregar 20 seg</button>
            <button type="button" class="accion" id="saltarTiempo" hidden>Saltar tiempo</button>
            <button type="button" class="accion" id="forzarLeaderboard" hidden>Forzar leaderboard (simular bots)</button>
            <button type="button" class="accion" id="forzarSiguiente" hidden>Forzar avance desde leaderboard</button>
            <button type="button" class="accion accion-volver" id="volver">Forzar retroceso</button>
        </footer>
        <div class="contadores-acciones" aria-live="polite">
            <p id="contadorForzar" hidden></p>
            <p id="contadorLeaderboard" hidden></p>
        </div>
        <p class="temporizador-guia" id="temporizadorGuia" role="timer" aria-live="polite" hidden></p>
        <section class="pruebas" id="pruebas" hidden aria-label="Accesos directos de prueba">
            <h2>Ir a una parte de la experiencia</h2>
            <label for="participantePrueba">Participante para visualizar</label>
            <select id="participantePrueba"></select>
            <nav class="accesos-prueba" id="accesosPrueba" aria-label="Partes de la experiencia"></nav>
        </section>
        <section class="controlador-usuarios" aria-label="Controlador de usuarios">
            <h2>Controlador de usuarios</h2>
            <ul class="lista" id="participantes" aria-label="Participantes de la sesión"></ul>
        </section>
        <p class="mensaje" id="mensaje" role="status" aria-live="polite"></p>
    </main>
    <script>
        const lista = document.getElementById('participantes');
        const listaEquipos = document.getElementById('equipos');
        const estado = document.getElementById('estadoSesion');
        const temporizadorGuia = document.getElementById('temporizadorGuia');
        const mensaje = document.getElementById('mensaje');
        const botonSimular = document.getElementById('simular');
        const botonComenzar = document.getElementById('comenzar');
        const botonForzarListo = document.getElementById('forzarListo');
        const botonAgregarTiempo = document.getElementById('agregarTiempo');
        const botonSaltarTiempo = document.getElementById('saltarTiempo');
        const botonForzarLeaderboard = document.getElementById('forzarLeaderboard');
        const botonForzarSiguiente = document.getElementById('forzarSiguiente');
        const contadorForzar = document.getElementById('contadorForzar');
        const contadorLeaderboard = document.getElementById('contadorLeaderboard');
        const botonVolver = document.getElementById('volver');
        const panelPruebas = document.getElementById('pruebas');
        const participantePrueba = document.getElementById('participantePrueba');
        const accesosPrueba = document.getElementById('accesosPrueba');
        let rondaIniciada = false;
        let participantesParaPrueba = [];
        let firmaParticipantesPrueba = '';
        let etapaTemporizadorGuia = '';
        let finTemporizadorGuia = 0;
        const duracionesGuia = {
            memoria: 30,
            adivinanza: 120,
            'ronda-2': 90,
            'ronda-3-notas': 30,
            'ronda-3-identificacion': 180
        };
        const etapasPrueba = [
            { clave: 'encuesta', nombre: 'Encuesta', ruta: () => '/encuesta?nueva=1' },
            { clave: 'efigie', nombre: 'Efigie', ruta: id => `/efigie/${encodeURIComponent(id)}` },
            { clave: 'lobby', nombre: 'Lobby', ruta: id => `/lobby/${encodeURIComponent(id)}?adminPreview=1` },
            { clave: 'pre-ronda-1', nombre: 'Pre-ronda 1', ruta: id => `/pre-ronda-1?id=${encodeURIComponent(id)}&adminPreview=1` },
            { clave: 'ronda-1-memoria', nombre: 'Ronda 1 · Memoria', ruta: id => `/ronda-1-preview?id=${encodeURIComponent(id)}&adminPreview=1` },
            { clave: 'ronda-1-adivinanza', nombre: 'Ronda 1 · Adivinanza', ruta: id => `/ronda-1-adivinar?id=${encodeURIComponent(id)}&adminPreview=1` },
            { clave: 'ronda-1-resultados', nombre: 'Ronda 1 · Resultados', ruta: id => `/ronda-1-leaderboard?id=${encodeURIComponent(id)}&adminPreview=1` },
            { clave: 'ronda-2', nombre: 'Ronda 2', ruta: id => `/ronda-2?id=${encodeURIComponent(id)}&adminPreview=1` },
            { clave: 'ronda-2-resultados', nombre: 'Resultados · Ronda 2', ruta: id => `/ronda-2-leaderboard?id=${encodeURIComponent(id)}&adminPreview=1` },
            { clave: 'ronda-3', nombre: 'Ronda 3 · Notas', ruta: id => `/ronda-3?id=${encodeURIComponent(id)}&adminPreview=1` },
            { clave: 'ronda-3-identificacion', nombre: 'Ronda 3 · Identificación', ruta: id => `/ronda-3-identificacion?id=${encodeURIComponent(id)}&adminPreview=1` },
            { clave: 'ronda-3-resultados', nombre: 'Ronda 3 · Resultados', ruta: id => `/ronda-3-leaderboard?id=${encodeURIComponent(id)}&adminPreview=1` },
            { clave: 'ronda-4', nombre: 'Ronda 4 · Borrador', ruta: id => `/ronda-4?id=${encodeURIComponent(id)}&adminPreview=1` }
        ];

        function actualizarAccesosPrueba(participantes) {
            participantesParaPrueba = participantes;
            const firmaParticipantes = participantes.map(participante =>
                `${participante.id}:${participante.nombre}:${participante.esBot}`
            ).join('|');
            if (firmaParticipantes === firmaParticipantesPrueba) {
                panelPruebas.hidden = !rondaIniciada || participantes.length === 0;
                return;
            }
            firmaParticipantesPrueba = firmaParticipantes;
            const idGuardado = localStorage.getItem('mi_efigie_id');
            const idSeleccionado = participantePrueba.value || idGuardado;
            participantePrueba.replaceChildren();
            for (const participante of participantes) {
                const opcion = document.createElement('option');
                opcion.value = participante.id;
                opcion.textContent = `${participante.nombre}${participante.esBot ? ' (simulado)' : ''}`;
                participantePrueba.append(opcion);
            }
            if ([...participantePrueba.options].some(opcion => opcion.value === idSeleccionado))
                participantePrueba.value = idSeleccionado;

            accesosPrueba.replaceChildren();
            for (const etapa of etapasPrueba) {
                const boton = document.createElement('button');
                boton.type = 'button';
                boton.className = 'accion';
                boton.textContent = etapa.nombre;
                boton.addEventListener('click', () => navegarParticipante(etapa));
                accesosPrueba.append(boton);
            }
            panelPruebas.hidden = !rondaIniciada || participantes.length === 0;
        }
        participantePrueba.addEventListener('change', () => actualizarAccesosPrueba(participantesParaPrueba));

        async function navegarParticipante(etapa) {
            const participante = participantesParaPrueba.find(persona => persona.id === participantePrueba.value);
            if (!participante) {
                mensaje.textContent = 'Seleccioná un participante para continuar.';
                return;
            }
            if (participante.esBot) {
                window.open(etapa.ruta(participante.id), '_blank', 'noopener');
                mensaje.textContent = `Abriendo vista de prueba de ${participante.nombre}.`;
                return;
            }
            try {
                const respuesta = await fetch('/api/admin/participante/navegar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ responseId: participante.id, etapa: etapa.clave })
                });
                if (!respuesta.ok) throw new Error('No se pudo enviar al participante a esa parte de la experiencia.');
                mensaje.textContent = `${participante.nombre} fue enviado a ${etapa.nombre}.`;
            } catch (error) {
                mensaje.textContent = error.message || 'No se pudo enviar la navegación.';
                console.error(error);
            }
        }

        function actualizarTemporizadorGuia(etapa, segundosServidor = 0) {
            const duracion = duracionesGuia[etapa];
            temporizadorGuia.hidden = !duracion;
            if (!duracion) {
                etapaTemporizadorGuia = '';
                finTemporizadorGuia = 0;
                return;
            }
            if (etapa !== etapaTemporizadorGuia) {
                etapaTemporizadorGuia = etapa;
                finTemporizadorGuia = Date.now() + duracion * 1000;
            }
            if (segundosServidor > 0 && ['memoria', 'adivinanza', 'ronda-3-notas'].includes(etapa))
                finTemporizadorGuia = Date.now() + segundosServidor * 1000;
            const segundos = Math.max(0, Math.ceil((finTemporizadorGuia - Date.now()) / 1000));
            const tiempo = `${Math.floor(segundos / 60)}:${String(segundos % 60).padStart(2, '0')}`;
            temporizadorGuia.textContent = `Tiempo orientativo: ${tiempo}${segundos === 0 ? ' · Podés avanzar' : ''}`;
        }

        async function cargarEstado() {
            try {
                const respuesta = await fetch('/api/admin/sesion', { cache: 'no-store' });
                if (!respuesta.ok) throw new Error('No se pudo consultar la sesión.');
                const sesion = await respuesta.json();
                const participantes = sesion.participantes || [];
                rondaIniciada = sesion.rondaIniciada;
                const preRondaActiva = sesion.preRondaActiva;
                const nombresEtapa = {
                    'memoria': 'Ronda 1 · Memoria',
                    'adivinanza': 'Ronda 1 · Adivinanza',
                    'leaderboard': 'Ronda 1 · Resultados',
                    'ronda-2': 'Ronda 2',
                    'ronda-3-notas': 'Ronda 3 · Notas',
                    'ronda-3-identificacion': 'Ronda 3 · Identificación',
                    'ronda-3-leaderboard': 'Ronda 3 · Resultados',
                    'ronda-4': 'Ronda 4 · Borrador'
                };
                estado.textContent = sesion.previewIniciada ? (nombresEtapa[sesion.etapaRondaUno] || 'Ronda 1') : preRondaActiva ? 'Pre-ronda 1' : `Esperando participantes... ${sesion.cantidad}/${sesion.capacidad}`;
                actualizarTemporizadorGuia(sesion.etapaRondaUno, sesion.segundosRestantesRondaUno);
                lista.hidden = participantes.length === 0;
                listaEquipos.hidden = !preRondaActiva;
                botonSimular.hidden = rondaIniciada;
                botonComenzar.hidden = rondaIniciada;
                botonComenzar.disabled = sesion.cantidad === 0;
                botonForzarListo.hidden = !preRondaActiva || sesion.previewIniciada;
                botonAgregarTiempo.hidden = !['memoria', 'adivinanza'].includes(sesion.etapaRondaUno);
                botonSaltarTiempo.hidden = !['memoria', 'adivinanza', 'ronda-3-notas'].includes(sesion.etapaRondaUno);
                botonForzarLeaderboard.hidden = sesion.etapaRondaUno !== 'adivinanza';
                botonForzarSiguiente.hidden = !['leaderboard', 'ronda-2', 'ronda-3-notas', 'ronda-3-identificacion', 'ronda-3-leaderboard'].includes(sesion.etapaRondaUno);
                const nombresForzar = {
                    leaderboard: 'Forzar avance a ronda 2',
                    'ronda-2': 'Forzar avance a ronda 3',
                    'ronda-3-notas': 'Forzar avance a identificación',
                    'ronda-3-identificacion': 'Forzar avance a resultados de ronda 3',
                    'ronda-3-leaderboard': 'Forzar avance a ronda 4'
                };
                const totalReales = Number(sesion.totalParticipantesReales) || 0;
                const respondieron = Number(sesion.respondieronEtapa) || 0;
                const listos = Number(sesion.listosEtapa) || 0;
                const contador = ['adivinanza', 'ronda-3-identificacion'].includes(sesion.etapaRondaUno)
                    ? `${respondieron}/${totalReales} participantes respondieron.`
                    : sesion.etapaRondaUno === 'ronda-3-notas'
                        ? 'El avance de esta etapa se controla desde administración.'
                        : `${listos}/${totalReales} participantes listos.`;
                botonForzarSiguiente.textContent = nombresForzar[sesion.etapaRondaUno] || 'Forzar avance';
                botonForzarLeaderboard.textContent = 'Forzar leaderboard (simular bots)';
                contadorForzar.hidden = botonForzarSiguiente.hidden;
                contadorForzar.textContent = contador;
                contadorLeaderboard.hidden = botonForzarLeaderboard.hidden;
                contadorLeaderboard.textContent = `${respondieron}/${totalReales} participantes respondieron.`;
                actualizarAccesosPrueba(sesion.participantes);
                lista.replaceChildren();
                listaEquipos.replaceChildren();

                for (const equipo of sesion.equipos) {
                    const tarjeta = document.createElement('section');
                    tarjeta.className = 'equipo';
                    tarjeta.style.setProperty('--color-equipo', equipo.color);
                    const titulo = document.createElement('h2');
                    titulo.textContent = `Equipo ${equipo.numero}`;
                    const puntaje = document.createElement('p');
                    puntaje.textContent = `${equipo.posibilidades}/7 posibilidades de triangulación · Puntaje ${equipo.puntaje}`;
                    const integrantes = document.createElement('ul');
                    integrantes.className = 'integrantes';
                    for (const integrante of equipo.integrantes) {
                        const fila = document.createElement('li');
                        fila.className = 'integrante';
                        fila.dataset.listo = String(integrante.listo);
                        const nombre = document.createElement('span');
                        nombre.textContent = integrante.nombre + (integrante.esBot ? ' (simulado)' : '');
                        const listo = document.createElement('span');
                        listo.className = 'estado-listo';
                        listo.textContent = integrante.listo ? 'Listo' : 'Esperando';
                        fila.append(nombre, listo);
                        integrantes.append(fila);
                    }
                    tarjeta.append(titulo, puntaje, integrantes);
                    listaEquipos.append(tarjeta);
                }

                for (const participante of sesion.participantes) {
                    const elemento = document.createElement('li');
                    elemento.className = 'participante';
                    const identidad = document.createElement('span');
                    identidad.className = 'identidad';
                    identidad.append(document.createTextNode(participante.nombre));
                    if (participante.esBot) {
                        const marca = document.createElement('span');
                        marca.className = 'marca-bot';
                        marca.textContent = 'SIMULADO';
                        identidad.append(marca);
                    }
                    const expulsar = document.createElement('button');
                    expulsar.type = 'button';
                    expulsar.className = 'expulsar';
                    expulsar.textContent = 'Expulsar';
                    expulsar.setAttribute('aria-label', `Expulsar a ${participante.nombre}`);
                    expulsar.disabled = rondaIniciada;
                    expulsar.addEventListener('click', () => expulsarParticipante(participante.id));
                    elemento.append(identidad, expulsar);
                    lista.append(elemento);
                }
            } catch (error) {
                mensaje.textContent = 'No se pudo actualizar el estado de la sesión.';
                console.error(error);
            }
        }

        async function expulsarParticipante(responseId) {
            const respuesta = await fetch('/api/admin/sesion/expulsar', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ responseId })
            });
            mensaje.textContent = respuesta.ok ? 'Participante expulsado.' : 'No se pudo expulsar al participante.';
            await cargarEstado();
        }

        async function enviarInicio(ruta, confirmacion) {
            if (!window.confirm(confirmacion)) return;
            const respuesta = await fetch(ruta, { method: 'POST' });
            mensaje.textContent = respuesta.ok ? 'Pre-ronda 1 iniciada.' : 'No se pudo comenzar la ronda.';
            await cargarEstado();
        }

        botonSimular.addEventListener('click', async () => {
            botonSimular.disabled = true;
            const respuesta = await fetch('/api/admin/sesion/simular', { method: 'POST' });
            mensaje.textContent = respuesta.ok ? 'Pre-ronda iniciada con participantes simulados.' : 'No se pudo simular la ronda.';
            await cargarEstado();
        });

        botonComenzar.addEventListener('click', () => enviarInicio('/api/admin/sesion/iniciar', '¿Comenzar la ronda? Los lugares vacíos se completarán con bots.'));

        botonForzarListo.addEventListener('click', async () => {
            botonForzarListo.disabled = true;
            try {
                const respuesta = await fetch('/api/admin/preronda/forzar-listo', { method: 'POST' });
                if (!respuesta.ok) throw new Error('No se pudo forzar el avance. Verificá que la pre-ronda esté activa.');
                mensaje.textContent = 'Avance forzado. Los participantes pasarán a la etapa de memoria.';
                await cargarEstado();
            } catch (error) {
                mensaje.textContent = error.message || 'No se pudo conectar con el servidor para forzar el avance.';
                console.error(error);
            } finally {
                botonForzarListo.disabled = false;
            }
        });

        botonAgregarTiempo.addEventListener('click', async () => {
            botonAgregarTiempo.disabled = true;
            try {
                const respuesta = await fetch('/api/admin/ronda-1/agregar-tiempo', { method: 'POST' });
                mensaje.textContent = respuesta.ok ? 'Se agregaron 20 segundos.' : 'No se pudo agregar tiempo.';
                await cargarEstado();
            } catch (error) {
                mensaje.textContent = 'No se pudo agregar tiempo.';
                console.error(error);
            } finally {
                botonAgregarTiempo.disabled = false;
            }
        });

        botonSaltarTiempo.addEventListener('click', () => forzarEtapa(
            botonSaltarTiempo,
            '/api/admin/ronda-1/saltar-tiempo',
            '¿Saltar el tiempo de esta etapa y avanzar?',
            'Se saltó el tiempo y se avanzó a la siguiente etapa.'
        ));

        async function forzarEtapa(boton, ruta, confirmacion, exito) {
            if (confirmacion && !window.confirm(confirmacion)) return;
            boton.disabled = true;
            try {
                const respuesta = await fetch(ruta, { method: 'POST' });
                if (!respuesta.ok) throw new Error('No se pudo forzar el avance. Verificá que la etapa correspondiente esté activa.');
                mensaje.textContent = exito;
                await cargarEstado();
            } catch (error) {
                mensaje.textContent = error.message || 'No se pudo conectar con el servidor.';
                console.error(error);
            } finally {
                boton.disabled = false;
            }
        }

        botonForzarLeaderboard.addEventListener('click', () => forzarEtapa(
            botonForzarLeaderboard,
            '/api/admin/ronda-1/forzar-leaderboard',
            '¿Forzar el cierre de la adivinanza y simular las respuestas de los bots?',
            'Adivinanza cerrada; los bots respondieron y se abrió la leaderboard.'
        ));
        botonForzarSiguiente.addEventListener('click', () => forzarEtapa(
            botonForzarSiguiente,
            '/api/admin/ronda-1/forzar-siguiente',
            '¿Forzar el avance desde la etapa actual?',
            'Se forzó el avance de todos los participantes.'
        ));

        botonVolver.addEventListener('click', async () => {
            botonVolver.disabled = true;
            const respuesta = await fetch('/api/admin/sesion/retroceder', { method: 'POST' });
            if (respuesta.ok) {
                const resultado = await respuesta.json();
                const nombresEtapa = {
                    'pre-ronda': 'la pre-ronda',
                    memoria: 'memoria de la ronda 1',
                    adivinanza: 'la adivinanza de la ronda 1',
                    leaderboard: 'los resultados de la ronda 1',
                    'ronda-2': 'la ronda 2',
                    'ronda-3-notas': 'las notas de la ronda 3',
                    'ronda-3-identificacion': 'la identificación de la ronda 3',
                    'ronda-3-leaderboard': 'los resultados de la ronda 3'
                };
                mensaje.textContent = !resultado.cambio
                    ? 'La sesión ya está en el lobby.'
                    : `Todos regresan a ${nombresEtapa[resultado.etapaAnterior] || 'la etapa anterior'}.`;
            } else {
                mensaje.textContent = 'No se pudo retroceder la sesión.';
            }
            botonVolver.disabled = false;
            await cargarEstado();
        });

        cargarEstado();
        const intervalo = setInterval(cargarEstado, 2500);
        const intervaloTemporizador = setInterval(() => actualizarTemporizadorGuia(etapaTemporizadorGuia), 1000);
        window.addEventListener('pagehide', () => {
            clearInterval(intervalo);
            clearInterval(intervaloTemporizador);
        });
    </script>
</body>
</html>
