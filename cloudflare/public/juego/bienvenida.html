<!DOCTYPE html>
<html lang="es">
<head>
    <script src="/lib/transporte.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efigie - Bienvenida</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #ffffff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .contenedor-efigie {
            width: 85vmin; height: 85vmin;
            display: flex; justify-content: center; align-items: center;
        }
        svg {
            width: 100%; height: 100%;
            overflow: visible;
        }
        @keyframes girarHorario {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes girarAntihorario {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }
        .rotar-capa-1, .rotar-capa-2, .rotar-capa-3 {
            transform-origin: 0px 0px;
            transform-box: view-box;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .rotar-capa-1 { animation-name: girarHorario; animation-duration: 18s; }
        .rotar-capa-2 { animation-name: girarAntihorario; animation-duration: 12s; }
        .rotar-capa-3 { animation-name: girarHorario; animation-duration: 8s; }

        .logo-bienvenida {
            position: absolute;
            top: 6vh;
            left: 50%;
            width: min(177px, 54vw);
            height: auto;
            opacity: 0;
            transform: translate(-50%, 10px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .logo-bienvenida.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .btn-generar {
            position: absolute;
            bottom: 8vh;
            padding: 14px 28px;
            background-color: #111;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease, background-color 0.2s;
            cursor: pointer;
        }
        .btn-generar.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .btn-generar:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <img src="/efigie-logo.svg" alt="Efigie" id="logoBienvenida" class="logo-bienvenida">
    <div class="contenedor-efigie" id="efigie"></div>
    <a href="/encuesta?nueva=1" id="btnGenerar" class="btn-generar">Generá tu Efigie</a>
    <script type="module">
        // Efigie aleatoria de bienvenida (antes la generaba el servidor C# con Rhino).
        import { generarSvg, inyectarAnimacionRotacion } from '/lib/efigie/svg.js';
        const elegir = lista => lista[Math.floor(Math.random() * lista.length)];
        const datos = {
            nombre: elegir(['Estudiante Anónimo', 'Diseñador Creativo', 'Explorador UCA', 'Innovador Visual', 'Arquitecto Digital']),
            anio: String(1995 + Math.floor(Math.random() * 12)),
            facultad: elegir(['Arquitectura y Diseño', 'Ciencias Económicas', 'Ingeniería y Ciencias Agrarias', 'Psicología y Psicopedagogía']),
            etapa: elegir(['1 (Ingresante / Primer año)', '3', '5', 'Docente']),
            estacion: elegir(['Primavera', 'Verano', 'Otoño', 'Invierno']),
            grupal: elegir(['Solo', 'Grupal']),
            formato: elegir(['Película', 'Serie', 'Libro', 'Videojuego', 'Teatro']),
            rol: elegir(['Proponer (Generar ideas iniciales)', 'Organizar (Estructurar y planificar)', 'Materializar (Llevar a la práctica)', 'Mejorar (Revisar y pulir detalles)'])
        };
        const config = await fetch('/api/config').then(r => r.json()).catch(() => ({}));
        document.getElementById('efigie').innerHTML = inyectarAnimacionRotacion(generarSvg(datos, config, false));
    </script>
    <script>
        const conservarRespuesta = new URLSearchParams(location.search).get('reinicioSesion') === '1';
        const respuestaAnterior = localStorage.getItem('mi_efigie_id');
        if (respuestaAnterior && !conservarRespuesta) {
            fetch('/api/iniciar?id=' + encodeURIComponent(respuestaAnterior), {
                method: 'POST',
                keepalive: true
            });
        }
        setTimeout(() => {
            document.getElementById('logoBienvenida').classList.add('visible');
            document.getElementById('btnGenerar').classList.add('visible');
        }, 1000);
    </script>
    <script src="/admin-navigation.js" defer></script>
</body>
</html>
