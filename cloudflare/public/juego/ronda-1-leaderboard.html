<!DOCTYPE html>
<html lang="es">
<head>
    <script src="/lib/transporte.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eaf3f0">
    <title>Resultados - Ronda 1 - Efigie</title>
    <link rel="stylesheet" href="/leaderboard.css">
</head>
<body>
    <main>
        <h1>Resultados de la ronda 1</h1>
        <p class="subtitulo">Puntaje promedio por equipo</p>
        <section class="equipos" id="equipos" aria-label="Tabla de posiciones"></section>
        <div class="acciones">
            <button type="button" id="listo">Estoy listo</button>
            <p class="mensaje" id="mensaje" role="status" aria-live="polite"></p>
        </div>
    </main>
    <script>
        const responseId = new URLSearchParams(window.location.search).get('id');
        const adminPreview = new URLSearchParams(window.location.search).get('adminPreview') === '1';
        const listaEquipos = document.getElementById('equipos');
        const botonListo = document.getElementById('listo');
        const mensaje = document.getElementById('mensaje');
        let cargando = false;
        let listo = false;
        let firmaTabla = '';

        function renderizar(equipos, equipoPropio) {
            const firmaActual = JSON.stringify({ equipos, equipoPropio });
            if (firmaActual === firmaTabla) return;
            firmaTabla = firmaActual;
            const posicionesAnteriores = new Map(
                [...listaEquipos.children].map(fila => [fila.dataset.equipo, fila.getBoundingClientRect().top])
            );
            const ordenAnterior = [...listaEquipos.children].map(elemento => elemento.dataset.equipo);
            equipos.forEach((equipo, indice) => {
                let fila = [...listaEquipos.children].find(elemento => elemento.dataset.equipo === String(equipo.numero));
                if (!fila) {
                    fila = document.createElement('article');
                    fila.className = 'equipo';
                    fila.dataset.equipo = String(equipo.numero);
                    fila.innerHTML = '<div class="identidad"><span class="posicion"></span><span class="nombre"></span></div><span class="puntos"></span>';
                }
                fila.style.setProperty('--color-equipo', equipo.color);
                fila.style.setProperty('--color-texto', equipo.colorTexto);
                fila.querySelector('.posicion').textContent = String(indice + 1);
                const nombre = fila.querySelector('.nombre');
                nombre.textContent = `Equipo ${equipo.numero}`;
                const esEquipoPropio = equipo.numero === equipoPropio;
                fila.classList.toggle('equipo-propio', esEquipoPropio);
                let marcaPropia = fila.querySelector('.marca-propia');
                if (esEquipoPropio && !marcaPropia) {
                    marcaPropia = document.createElement('span');
                    marcaPropia.className = 'marca-propia';
                    marcaPropia.textContent = 'Tu equipo';
                    nombre.after(marcaPropia);
                } else if (!esEquipoPropio) {
                    marcaPropia?.remove();
                }
                fila.querySelector('.puntos').textContent = `${equipo.puntos} pts`;
                if (ordenAnterior[indice] !== String(equipo.numero))
                    listaEquipos.insertBefore(fila, listaEquipos.children[indice] || null);
            });
            for (const fila of [...listaEquipos.children]) {
                const topAnterior = posicionesAnteriores.get(fila.dataset.equipo);
                if (topAnterior === undefined) continue;
                const desplazamiento = topAnterior - fila.getBoundingClientRect().top;
                if (Math.abs(desplazamiento) < 1) continue;
                fila.classList.add('animando');
                const duracion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 650;
                const animacion = fila.animate(
                    [{ transform: `translateY(${desplazamiento}px)` }, { transform: 'translateY(0)' }],
                    { duration: duracion, easing: 'cubic-bezier(0.2, 0.75, 0.25, 1)' }
                );
                animacion.onfinish = () => fila.classList.remove('animando');
            }
        }

        async function marcarListo() {
            if (listo || !responseId || adminPreview) return;
            botonListo.disabled = true;
            try {
                const respuesta = await fetch('/api/ronda-1/listo-siguiente', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ responseId })
                });
                if (!respuesta.ok) throw new Error('No se pudo registrar que estás listo.');
                const resultado = await respuesta.json();
                listo = true;
                botonListo.textContent = 'Listo';
                if (resultado.rondaLista && resultado.etapaRondaUno === 'ronda-2-representante') {
                    window.location.replace('/ronda-2-representante?ronda=2&id=' + encodeURIComponent(responseId));
                    return;
                }
                mensaje.textContent = 'Esperando a los demás integrantes de tu equipo.';
                await actualizarEstado();
            } catch (error) {
                mensaje.textContent = error.message;
                console.error(error);
                botonListo.disabled = false;
            }
        }

        async function actualizarEstado() {
            if (cargando || !responseId) return;
            cargando = true;
            try {
                const respuesta = await fetch('/api/ronda-1/estado?responseId=' + encodeURIComponent(responseId), { cache: 'no-store' });
                if (!respuesta.ok) throw new Error('No se pudo consultar la leaderboard.');
                const estado = await respuesta.json();
                if (!estado.rondaIniciada && !adminPreview) {
                    window.location.replace('/lobby/' + encodeURIComponent(responseId));
                    return;
                }
                const destinos = {
                    'pre-ronda': '/pre-ronda-1',
                    'memoria': '/ronda-1-preview',
                    'adivinanza': '/ronda-1-adivinar',
                    'leaderboard': '/ronda-1-leaderboard',
                    'ronda-2-representante': '/ronda-2-representante?ronda=2',
                    'ronda-2-identificacion': '/ronda-2',
                    'ronda-2-leaderboard': '/ronda-2-leaderboard',
                    'ronda-3': '/ronda-3'
                };
                const esperandoRespuesta = estado.etapaRondaUno === 'adivinanza' && estado.yaRespondio;
                if (['ronda-2-representante', 'ronda-2-identificacion', 'ronda-2-leaderboard', 'ronda-3'].includes(estado.etapaRondaUno) && !adminPreview) {
                    const destino = destinos[estado.etapaRondaUno];
                    window.location.replace(destino + (destino.includes('?') ? '&' : '?') + 'id=' + encodeURIComponent(responseId));
                    return;
                }
                if (estado.etapaRondaUno !== 'leaderboard' && !esperandoRespuesta && !adminPreview) {
                    window.location.replace((destinos[estado.etapaRondaUno] || '/pre-ronda-1') + '?id=' + encodeURIComponent(responseId));
                    return;
                }
                renderizar(estado.equipos, estado.equipoPropio);
                listo = estado.listoSiguiente;
                botonListo.disabled = adminPreview || listo || esperandoRespuesta;
                botonListo.textContent = adminPreview ? 'Vista de prueba' : listo ? 'Listo' : 'Estoy listo';
                mensaje.textContent = listo
                    ? `Esperando a los demás integrantes de tu equipo (${estado.cantidadListosSiguiente}/${estado.totalParticipantes}).`
                    : esperandoRespuesta
                        ? 'Esperando a que termine el tiempo de adivinanza.'
                        : `${estado.cantidadListosSiguiente}/${estado.totalParticipantes} integrantes de tu equipo listos.`;
            } catch (error) {
                mensaje.textContent = 'No se pudo conectar con la leaderboard. Reintentando...';
                console.error(error);
            } finally {
                cargando = false;
            }
        }

        botonListo.addEventListener('click', marcarListo);
        actualizarEstado();
        const intervalo = setInterval(actualizarEstado, 2500);
        window.addEventListener('pagehide', () => clearInterval(intervalo));
    </script>
    <script src="/admin-navigation.js" defer></script>
</body>
</html>
