<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eaf3f0">
    <title>Preparación de Ronda 3 - Efigie</title>
    <style>
        :root { color-scheme: light; --equipo: #133463; --texto-equipo: #fff; --ink: #101a15; --muted: #53615b; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #eaf3f0; color: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
        main { width: min(100%, 620px); text-align: center; }
        .logo { display: block; width: min(190px, 52vw); height: auto; margin: 0 auto 34px; }
        .equipo { display: inline-block; margin: 0 0 20px; padding: 10px 24px; border-radius: 999px; background: var(--equipo); color: var(--texto-equipo); font-size: clamp(1rem, 3vw, 1.25rem); font-weight: 700; }
        .etapa { margin: 0 0 10px; color: var(--muted); font-size: .9rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.4rem); line-height: 1.1; }
        .instruccion { max-width: 470px; margin: 18px auto 0; color: var(--muted); font-size: clamp(1rem, 2.8vw, 1.2rem); line-height: 1.5; }
        .mensaje { min-height: 1.5em; margin: 18px 0 0; color: #8c2525; }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/efigie-logo.svg" alt="Efigie">
        <p class="equipo" id="equipo" hidden></p>
        <p class="etapa">Ronda 3</p>
        <h1>Prepará a tu equipo</h1>
        <p class="instruccion">Escuchá la indicación y mantenete cerca de tu equipo. El desafío comienza automáticamente cuando termina la introducción.</p>
        <p class="mensaje" id="mensaje" role="status" aria-live="polite"></p>
    </main>
    <script>
        const parametros = new URLSearchParams(location.search);
        const responseId = parametros.get('id');
        const adminPreview = parametros.get('adminPreview') === '1';
        const mensaje = document.getElementById('mensaje');
        const equipo = document.getElementById('equipo');
        let cargando = false;

        async function actualizarEstado() {
            if (cargando || !responseId) return;
            cargando = true;
            try {
                const respuesta = await fetch(`/api/ronda-3/preronda?responseId=${encodeURIComponent(responseId)}`, { cache: 'no-store' });
                if (!respuesta.ok) throw new Error('No se pudo consultar la etapa de preparación.');
                const estado = await respuesta.json();
                equipo.textContent = estado.nombreEquipo;
                equipo.hidden = !estado.equipo;
                document.documentElement.style.setProperty('--equipo', estado.color);
                document.documentElement.style.setProperty('--texto-equipo', estado.colorTexto);
                if (adminPreview) return;
                if (estado.etapaRondaUno === 'ronda-3') {
                    location.replace(`/ronda-3?id=${encodeURIComponent(responseId)}`);
                } else if (estado.etapaRondaUno === 'ronda-3-leaderboard') {
                    location.replace(`/ronda-3-leaderboard?id=${encodeURIComponent(responseId)}`);
                }
                mensaje.textContent = '';
            } catch (error) {
                mensaje.textContent = error.message || 'No se pudo conectar con el servidor.';
                console.error(error);
            } finally {
                cargando = false;
            }
        }

        if (!responseId) {
            mensaje.textContent = 'Falta el identificador de participante.';
        } else {
            actualizarEstado();
            const intervalo = setInterval(actualizarEstado, 900);
            window.addEventListener('pagehide', () => clearInterval(intervalo));
        }
    </script>
    <script src="/admin-navigation.js" defer></script>
</body>
</html>
