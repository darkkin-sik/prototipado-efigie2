<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eaf3f0">
    <title>Ronda 3 - Efigie</title>
    <style>
        :root { color-scheme: light; --paper: #eaf3f0; --ink: #101a15; --muted: #53615b; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
        main { width: min(100%, 520px); text-align: center; }
        .logo { width: min(177px, 54vw); height: auto; margin: 0 auto 34px; }
        h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 7vw, 2.4rem); }
        p { color: var(--muted); line-height: 1.5; }
        .estado { display: inline-block; margin-top: 12px; padding: 8px 14px; border-radius: 999px; background: #dcebe2; color: #355a46; font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/efigie-logo.svg" alt="Efigie">
        <h1>Ronda 3</h1>
        <p>Esta parte de la experiencia todavía está en preparación.</p>
        <span class="estado">Borrador</span>
    </main>
    <script src="/admin-navigation.js" defer></script>
</body>
</html>
