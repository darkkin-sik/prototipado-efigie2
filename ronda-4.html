<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eaf3f0">
    <title>Ronda 3 - Efigie</title>
    <style>
        :root { color-scheme: light; --paper: #eaf3f0; --ink: #101a15; --muted: #53615b; --line: #cbd6d0; --blue: #133463; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body { display: grid; min-height: 100vh; place-items: center; padding: 20px; background: var(--paper); color: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
        main { width: min(100%, 520px); text-align: center; }
        .logo { display: block; width: min(38vw, 150px); margin: 0 auto 30px; }
        .etiqueta { margin: 0 0 12px; color: var(--muted); font-size: .82rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(2.2rem, 11vw, 4rem); line-height: 1; }
        p { max-width: 34ch; margin: 18px auto 0; color: var(--muted); font-size: 1.1rem; line-height: 1.55; }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/efigie-logo.svg" alt="Efigie">
        <p class="etiqueta">Ronda 3</p>
        <h1>Muy pronto</h1>
        <p>La próxima parte de la experiencia está en preparación.</p>
    </main>
    <script src="/admin-navigation.js" defer></script>
</body>
</html>
