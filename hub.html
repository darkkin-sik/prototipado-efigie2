<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Inicio del hub - Efigie</title>
    <link rel="stylesheet" href="/hub.css">
    <script type="module" src="/hub-parrafos.js"></script>
</head>
<body>
    <main class="portada-contenido">
        <img id="logoHub" class="portada-logo" src="/efigie-logo.svg" alt="Efigie" aria-hidden="true">
        <div id="efigieHub" class="portada-efigie" role="img" aria-label="Efigie aleatoria de bienvenida"></div>
        <p id="errorHub" class="hub-error" role="alert" hidden></p>
        <a id="btnIngresar" class="boton-principal" href="/hub-ingresar.html" aria-hidden="true" tabindex="-1">Ingresar</a>
    </main>
    <script>
        async function cargarPortada() {
            const efigie = document.getElementById('efigieHub');
            const error = document.getElementById('errorHub');
            const logo = document.getElementById('logoHub');
            const boton = document.getElementById('btnIngresar');
            const sesionActual = new URLSearchParams(location.search).get('sesion') === 'actual'
                ? sessionStorage.getItem('efigieHubSesionActual') : null;

            if (sesionActual) {
                boton.textContent = 'Continuar';
                boton.href = '/hub-ingresar.html';
                boton.addEventListener('click', async evento => {
                    evento.preventDefault();
                    if (boton.getAttribute('aria-disabled') === 'true') return;
                    boton.setAttribute('aria-disabled', 'true');
                    try {
                        const respuesta = await fetch('/api/hub/iniciar-sesion-actual', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ responseId: sesionActual })
                        });
                        if (respuesta.status === 401) {
                            sessionStorage.removeItem('efigieHubSesionActual');
                            location.href = '/hub-ingresar.html?sesion=expirada';
                            return;
                        }
                        if (!respuesta.ok) throw new Error(`El servidor respondió ${respuesta.status}.`);
                        sessionStorage.setItem('efigieHubUsuario', JSON.stringify(await respuesta.json()));
                        sessionStorage.removeItem('efigieHubSesionActual');
                        location.href = '/hub-en-proceso.html';
                    } catch (errorCarga) {
                        console.error('No se pudo iniciar sesión automáticamente.', errorCarga);
                        error.textContent = 'No se pudo iniciar sesión. Revisá tu conexión e intentá nuevamente.';
                        error.hidden = false;
                    } finally {
                        boton.removeAttribute('aria-disabled');
                    }
                });
            }

            try {
                const respuesta = await fetch('/api/hub/efigie', { cache: 'no-store' });
                if (!respuesta.ok) throw new Error(`El servidor respondió ${respuesta.status}.`);

                const svg = await respuesta.text();
                if (!svg.includes('<svg')) throw new Error('El servidor no devolvió una efigie válida.');
                efigie.innerHTML = svg;

                window.setTimeout(() => {
                    logo.classList.add('visible');
                    logo.removeAttribute('aria-hidden');
                    boton.classList.add('visible');
                    boton.removeAttribute('aria-hidden');
                    boton.removeAttribute('tabindex');
                }, 2000);
            } catch (errorCarga) {
                console.error('No se pudo cargar la efigie de bienvenida del hub.', errorCarga);
                error.textContent = 'No se pudo cargar la efigie. Recargá la página para volver a intentar.';
                error.hidden = false;
            }
        }

        cargarPortada();
    </script>
</body>
</html>
