<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eaf3f0">
    <title>Futuro hub - Efigie</title>
    <style>
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #eaf3f0;
            color: #101a15;
            font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        }
        main { text-align: center; }
        img { display: block; width: min(190px, 52vw); height: auto; margin: 0 auto 28px; }
        h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 5rem); }
    </style>
</head>
<body>
    <main>
        <img src="/efigie-logo.svg" alt="Efigie">
        <h1>Futuro hub</h1>
    </main>
</body>
</html>
