<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Ronda 3 · Identificación - Efigie</title>
    <style>
        :root { color-scheme: light; --paper: #fff; --ink: #101a15; --muted: #53615b; --line: #cbd6d0; --green: #6eb392; --green-dark: #4a896b; --selected: #dcebe2; }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body { min-height: 100vh; padding: 18px 20px max(24px, env(safe-area-inset-bottom)); background: var(--paper); color: var(--ink); font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
        main { width: min(100%, 620px); margin: 0 auto; }
        h1 { margin: 10px 0 4px; text-align: center; font-size: clamp(1.3rem, 5vw, 1.65rem); line-height: 1.2; font-weight: 500; }
        .instruccion { margin: 0; text-align: center; color: var(--muted); line-height: 1.4; }
        .efigie { width: min(88vw, 470px); aspect-ratio: 1; margin: 8px auto 10px; }
        .efigie svg { display: block; width: 100%; height: 100%; overflow: visible; background: transparent !important; }
        .efigie [data-capa].resaltada { filter: drop-shadow(0 0 2px #e53920); }
        .efigie [data-capa].resaltada, .efigie [data-capa].resaltada * { stroke: #e53920 !important; stroke-width: 1.15 !important; }
        .progreso { display: flex; justify-content: center; gap: 9px; margin: 0 0 8px; }
        .paso { width: 10px; height: 10px; border: 1px solid #53615b; border-radius: 50%; background: transparent; }
        .paso.activo { background: var(--green-dark); border-color: var(--green-dark); }
        .paso.completo { background: #6eb392; border-color: #286547; }
        .pregunta { width: min(100%, 500px); margin: 0 auto; }
        .pregunta h2 { margin: 0 0 6px; text-align: center; font-size: 1rem; font-weight: 500; }
        .opciones select { display: block; width: 100%; min-height: 48px; padding: 9px 12px; border: 1px solid #87938c; border-radius: 5px; background: #fff; color: var(--ink); font: inherit; }
        .opciones option.utilizada { color: #929a95; }
        .opciones select:focus-visible, .navegacion button:focus-visible, .notas-consulta summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
        .navegacion { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; }
        .navegacion button { min-width: 120px; min-height: 44px; padding: 9px 14px; border: 0; border-radius: 5px; background: var(--green); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
        .navegacion button:hover:not(:disabled) { background: var(--green-dark); color: #fff; }
        .navegacion button:disabled { opacity: 0.5; cursor: default; }
        .mensaje { min-height: 1.4em; margin: 6px 0 0; text-align: center; color: var(--muted); }
        .notas-consulta { position: fixed; z-index: 4; top: 50%; left: 0; transform: translateY(-50%); }
        .notas-consulta summary { display: inline-flex; align-items: center; min-height: 52px; padding: 12px 10px; border: 1px solid #b6c9bf; border-left: 0; border-radius: 0 8px 8px 0; background: var(--green); color: var(--ink); font-size: .9rem; font-weight: 700; cursor: pointer; list-style: none; writing-mode: vertical-rl; transition: background-color 180ms ease, padding 180ms ease; animation: indicar-notas 900ms ease-in-out 2 500ms; }
        .notas-consulta summary::after { content: " ◀"; }
        .notas-consulta[open] summary::after { content: " ▶"; }
        .notas-consulta summary:hover { padding-inline: 14px; background: var(--green-dark); color: #fff; }
        .notas-consulta summary::-webkit-details-marker { display: none; }
        .notas-panel { position: absolute; top: 50%; left: 100%; width: min(84vw, 420px); height: min(72vh, 680px); margin-left: 10px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 8px 24px rgb(16 26 21 / 20%); opacity: 0; transform: translate(-12px, -50%); transition: opacity 220ms ease, transform 220ms ease; pointer-events: none; }
        .notas-consulta[open] .notas-panel { opacity: 1; transform: translate(0, -50%); pointer-events: auto; }
        .notas-panel iframe { display: block; width: 100%; height: 100%; border: 0; }
        @keyframes indicar-notas { 50% { box-shadow: 0 0 0 5px rgb(74 137 107 / 30%); } }
        [hidden] { display: none !important; }
        @media (max-height: 720px) {
            body { padding-top: 10px; }
            h1 { margin-top: 5px; }
            .efigie { width: min(66vh, 360px); margin-block: 0; }
            .progreso { margin-bottom: 4px; }
        }
        @media (max-width: 380px) {
            body { padding-inline: 14px; }
            .efigie { width: min(90vw, 440px); }
            .navegacion button { min-width: 110px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Relacioná cada parte con lo que representa</h1>
        <p class="instruccion">Elegí una opción para cada parte resaltada.</p>
        <div class="efigie" id="efigie" role="img" aria-label="Tu efigie con una parte resaltada"></div>
        <nav class="progreso" id="progreso" aria-label="Progreso de respuestas"></nav>
        <section class="pregunta" aria-label="Opciones de respuesta">
            <h2 id="tituloPregunta">¿Qué representa esta parte?</h2>
            <div class="opciones">
                <select id="opciones" aria-label="Elegí qué representa esta parte"></select>
            </div>
            <div class="navegacion">
                <button type="button" id="anterior">Anterior</button>
                <button type="button" id="siguiente">Siguiente</button>
            </div>
        </section>
        <p class="mensaje" id="mensaje" role="status" aria-live="polite"></p>
    </main>
    <details class="notas-consulta">
        <summary aria-label="Abrir o cerrar la primera parte de la ronda">Notas</summary>
        <div class="notas-panel">
            <iframe id="vistaNotas" title="Primera parte de la ronda 3: efigies y notas"></iframe>
        </div>
    </details>
    <script>
        const parametros = new URLSearchParams(location.search);
        const responseId = parametros.get('id');
        const adminPreview = parametros.get('adminPreview') === '1';
        const queryVista = adminPreview ? '&adminPreview=1' : '';
        const apiVista = adminPreview ? '?adminPreview=1' : '';
        const efigie = document.getElementById('efigie');
        const opciones = document.getElementById('opciones');
        const progreso = document.getElementById('progreso');
        const botonAnterior = document.getElementById('anterior');
        const botonSiguiente = document.getElementById('siguiente');
        const mensaje = document.getElementById('mensaje');
        const vistaNotas = document.getElementById('vistaNotas');
        let preguntas = [];
        let respuestas = [];
        let indiceActual = 0;
        let cargando = false;
        let enviando = false;

        function urlEtapa(destino) {
            const query = new URLSearchParams({ id: responseId });
            for (const clave of ['espectador', 'sesion']) {
                const valor = parametros.get(clave);
                if (valor) query.set(clave, valor);
            }
            if (adminPreview) query.set('adminPreview', '1');
            return `${destino}?${query}`;
        }

        function actualizarControles() {
            botonAnterior.disabled = indiceActual === 0 || enviando;
            botonSiguiente.disabled = indiceActual === preguntas.length - 1 || enviando;
            progreso.querySelectorAll('.paso').forEach((paso, indice) => {
                paso.classList.toggle('activo', indice === indiceActual);
                paso.classList.toggle('completo', Boolean(respuestas[indice]));
            });
        }

        function dibujarPregunta() {
            if (!preguntas.length) return;
            efigie.querySelectorAll('[data-capa]').forEach(capa => capa.classList.remove('resaltada'));
            const pregunta = preguntas[indiceActual];
            const capa = efigie.querySelector(`[data-capa="${CSS.escape(pregunta.layer)}"]`);
            if (!capa) throw new Error('No se pudo resaltar la parte seleccionada de la efigie.');
            capa.classList.add('resaltada');
            opciones.replaceChildren();
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Seleccioná una opción';
            opciones.append(placeholder);
            const opcionesUsadas = new Set(respuestas.slice(0, indiceActual).filter(Boolean));
            const opcionesOrdenadas = [
                ...pregunta.opciones.filter(opcion => !opcionesUsadas.has(opcion)),
                ...pregunta.opciones.filter(opcion => opcionesUsadas.has(opcion))
            ];
            opcionesOrdenadas.forEach(opcion => {
                const opcionElemento = document.createElement('option');
                opcionElemento.value = opcion;
                opcionElemento.textContent = opcion;
                if (opcionesUsadas.has(opcion)) opcionElemento.classList.add('utilizada');
                opciones.append(opcionElemento);
            });
            opciones.value = respuestas[indiceActual] || '';
            opciones.disabled = enviando;
            document.getElementById('tituloPregunta').textContent = `¿Qué representa esta parte? (${indiceActual + 1} de ${preguntas.length})`;
            actualizarControles();
        }

        async function seleccionarRespuesta(opcion) {
            if (enviando || !responseId) return;
            respuestas[indiceActual] = opcion;
            enviando = true;
            actualizarControles();
            try {
                dibujarPregunta();
                const respuesta = await fetch(`/api/ronda-3/responder${apiVista}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ responseId, answers: respuestas, finalizar: false })
                });
                if (!respuesta.ok) throw new Error('No se pudo guardar la selección.');
                mensaje.textContent = '';
            } catch (error) {
                mensaje.textContent = error.message || 'No se pudo guardar la selección.';
                console.error(error);
            } finally {
                enviando = false;
                opciones.disabled = false;
                actualizarControles();
            }
        }

        async function redirigirSegunEtapa() {
            const respuesta = await fetch(`/api/ronda-1/estado?responseId=${encodeURIComponent(responseId)}`, { cache: 'no-store' });
            if (!respuesta.ok) return;
            const estado = await respuesta.json();
            const destinos = {
                'pre-ronda': '/pre-ronda-1',
                memoria: '/ronda-1-preview',
                adivinanza: '/ronda-1-adivinar',
                leaderboard: '/ronda-1-leaderboard',
                'ronda-2': '/ronda-2',
                'ronda-3-notas': '/ronda-3',
                'ronda-3-leaderboard': '/ronda-3-leaderboard',
                'ronda-4': '/ronda-4'
            };
            const destino = destinos[estado.etapaRondaUno];
            if (destino && !adminPreview)
                location.replace(urlEtapa(destino));
        }

        async function cargarEstado() {
            if (cargando || enviando || !responseId) return;
            cargando = true;
            try {
                const respuesta = await fetch(`/api/ronda-3/identificacion?responseId=${encodeURIComponent(responseId)}${queryVista}`, { cache: 'no-store' });
                if (respuesta.status === 409 && !adminPreview) {
                    await redirigirSegunEtapa();
                    return;
                }
                if (!respuesta.ok) throw new Error('No se pudo consultar la ronda 3.');
                const estado = await respuesta.json();
                if (preguntas.length === 0) {
                    efigie.innerHTML = estado.efigie;
                    preguntas = estado.preguntas;
                    respuestas = [...estado.respuestas];
                    progreso.replaceChildren(...preguntas.map((_, indice) => {
                        const punto = document.createElement('span');
                        punto.className = 'paso';
                        punto.setAttribute('aria-label', `Respuesta ${indice + 1}`);
                        return punto;
                    }));
                    dibujarPregunta();
                } else {
                    respuestas = [...estado.respuestas];
                    actualizarControles();
                }
                if (estado.respondido) {
                    botonAnterior.disabled = true;
                    botonSiguiente.disabled = true;
                    opciones.disabled = true;
                    mensaje.textContent = adminPreview ? 'Respuestas completas en la vista de prueba.' : 'El equipo coincidió en sus respuestas.';
                    if (!adminPreview)
                        location.replace(urlEtapa('/ronda-3-leaderboard'));
                } else if (estado.respuestasCompletas) {
                    mensaje.textContent = 'Respuestas guardadas. Esperando que el equipo coincida en las seis preguntas.';
                }
            } catch (error) {
                mensaje.textContent = error.message || 'No se pudo conectar con la ronda. Reintentando...';
                console.error(error);
            } finally {
                cargando = false;
            }
        }

        botonAnterior.addEventListener('click', () => {
            if (indiceActual > 0) {
                indiceActual--;
                dibujarPregunta();
            }
        });
        botonSiguiente.addEventListener('click', () => {
            if (indiceActual < preguntas.length - 1) {
                indiceActual++;
                dibujarPregunta();
            }
        });
        opciones.addEventListener('change', () => seleccionarRespuesta(opciones.value));
        if (!responseId) {
            mensaje.textContent = 'Falta el identificador de participante.';
        } else {
            vistaNotas.src = `/ronda-3?id=${encodeURIComponent(responseId)}${adminPreview ? '&adminPreview=1' : ''}&consulta=1`;
            cargarEstado();
            const intervalo = setInterval(cargarEstado, 900);
            window.addEventListener('pagehide', () => {
                clearInterval(intervalo);
            });
        }
    </script>
    <script src="/admin-navigation.js" defer></script>
</body>
</html>
